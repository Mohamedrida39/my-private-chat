<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>M.R.G</title>
  <meta name="theme-color" content="#1c1c1e">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="M.R.G">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- واجهة الدخول الصامتة: خانة واحدة فقط -->
  <main id="gate">
    <input id="code" name="q" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="">
  </main>

  <!-- المحادثة -->
  <section id="chat" hidden>
    <header>
      <div class="peer">
        <div id="peerName"></div>
        <div id="peerStatus"></div>
      </div>
      <button id="bell" type="button" aria-label="bell">🔔</button>
      <button id="menuBtn" type="button" aria-label="menu">⋮</button>
      <div id="menu" hidden>
        <button id="enablePush" type="button">تفعيل الإشعارات</button>
        <button id="clearChat" type="button">مسح المحادثة عند الطرفين</button>
        <button id="logout" type="button">خروج</button>
      </div>
    </header>

    <div id="list"></div>

    <footer>
      <button id="attach" type="button" aria-label="attach">📎</button>
      <input id="file" type="file" accept="image/*,video/*" hidden>
      <textarea id="text" rows="1" dir="auto" autocomplete="off"></textarea>
      <button id="mic" type="button" aria-label="record">🎙️</button>
      <button id="send" type="button" aria-label="send" hidden>➤</button>
    </footer>

    <div id="rec" hidden>
      <button id="recCancel" type="button" aria-label="cancel">✕</button>
      <span class="dot"></span><span id="recTime">0:00</span>
      <button id="recSend" type="button" aria-label="send">➤</button>
    </div>

    <div id="lightbox" hidden></div>
    <div id="toast" hidden></div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
